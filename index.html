<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>K♥ TV DISPLAY</title>
    <style>
        :root { --red: #ff0000; --white: #ffffff; }
        body { 
            background: #000; color: #fff; font-family: 'Courier New', monospace; 
            margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; overflow: hidden; text-transform: uppercase;
        }

        /* TV Distortion */
        body::after {
            content: " "; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            z-index: 1000; background-size: 100% 4px; pointer-events: none;
            animation: flicker 0.1s infinite;
        }

        @keyframes flicker { 0% { opacity: 0.9; } 50% { opacity: 1; } 100% { opacity: 0.9; } }

        #target-box { font-size: 6rem; border: 10px solid var(--red); padding: 20px 60px; color: var(--red); margin-bottom: 20px; }
        
        table { width: 90%; border-collapse: collapse; font-size: 2.5rem; }
        th { border-bottom: 5px solid var(--white); padding: 10px; color: var(--red); }
        td { padding: 20px; text-align: center; border-bottom: 1px solid #222; }

        .winner-row { background: var(--white); color: #000; animation: flash 0.6s step-end infinite; }
        @keyframes flash { 50% { background: var(--red); color: #fff; } }

        #secret-fs-tv { position: fixed; top:0; left:0; width: 50px; height:50px; z-index: 9999; }
    </style>
</head>
<body>

    <div id="secret-fs-tv" onclick="document.documentElement.requestFullscreen()"></div>

    <div style="font-size: 2rem; letter-spacing: 15px; margin-bottom: 10px;">TARGET NUMBER</div>
    <div id="target-box">00.00</div>

    <table>
        <thead>
            <tr><th>PLAYER</th><th>NUMBER</th><th>SCORE</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
    </table>

    <script>
        function speak(txt) {
            let u = new SpeechSynthesisUtterance(txt);
            u.rate = 0.8; u.pitch = 0.5; // Robotic Deep Voice
            window.speechSynthesis.speak(u);
        }

        window.addEventListener('storage', (e) => {
            if (e.key !== 'k-data') return;
            let data = JSON.parse(e.newValue);
            
            document.getElementById('target-box').innerText = data.target;

            let html = "";
            data.players.forEach(p => {
                let isW = (p.name === data.winner);
                html += `<tr class="${isW ? 'winner-row' : ''}">
                    <td>${p.name}</td>
                    <td>${p.choice}</td>
                    <td>${p.points}</td>
                </tr>`;
            });
            document.getElementById('tbody').innerHTML = html;

            speak(`The target number is ${data.target}. The winner of this round is ${data.winner}.`);
        });
    </script>
</body>
</html>
